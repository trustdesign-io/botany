name: Deploy

# Builds the static export and uploads it to cPanel (public_html/botany) over FTPS.
# Requires repo secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Optional repo variable FTP_SERVER_DIR (default "./", for an FTP account rooted at public_html/botany).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & upload
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Upload to cPanel
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}

      - name: Skipped upload
        if: env.HAS_FTP != 'true'
        run: echo "::warning::FTP secrets not set; built but did not deploy."
